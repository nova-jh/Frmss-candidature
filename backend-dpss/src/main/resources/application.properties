spring.application.name=candidature-dpss
# Port sur lequel ton serveur backend va tourner (8080 par défaut)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Spring Boot 4 utilise spring.mongodb.uri pour configurer la connexion.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/candidature-dpss}

# Valeurs de production a fournir comme variables d'environnement.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
